<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Navigation App - Register</title>
<!-- Optional: nicer font -->
<link
	href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
	rel="stylesheet">
<link rel="stylesheet" href="../Register/register.css" />
</head>
<body>
	<div class="register-container">
		<div class="logo-container">
			<img src="../images/backgroundimg.jpg" alt="Map Icon" class="logo">
		</div>
		<h2 class="title">Create Account</h2>
		<p class="subtitle">Join our Navigation App to start your journey</p>

		<form id="registerForm">
			<div class="form-group">
				<label for="name">Full Name</label> <input id="name" type="text"
					placeholder="Enter your full name" required />
			</div>

			<div class="form-group">
				<label for="email">Email Address</label>
				<div class="otp-row">
					<input id="email" type="email" placeholder="your@email.com"
						required />
					<button type="button" class="otp-btn" id="sendEmailOtpBtn">Send
						OTP</button>
				</div>
			</div>

			<div class="form-group">
				<label for="emailOtp">Email OTP</label> <input id="emailOtp"
					type="text" placeholder="Enter Email OTP" inputmode="numeric"
					maxlength="6" disabled />
			</div>

			<div class="form-group">
				<label for="mobile">Mobile Number</label>
				<div class="otp-row">
					<input id="mobile" type="tel" placeholder="10-digit mobile number"
						pattern="[0-9]{10}" required />
					<button type="button" class="otp-btn" id="sendMobileOtpBtn">Send
						OTP</button>
				</div>
			</div>

			<div class="form-group">
				<label for="mobileOtp">Mobile OTP</label> <input id="mobileOtp"
					type="text" placeholder="Enter Mobile OTP" inputmode="numeric"
					maxlength="6" disabled />
			</div>

			<div class="form-group">
				<label for="password">Password</label> <input id="password"
					type="password" placeholder="Min 6 characters" minlength="6"
					required />
			</div>

			<div class="form-group">
				<label for="confirmPassword">Confirm Password</label> <input
					id="confirmPassword" type="password"
					placeholder="Re-enter password" minlength="6" required />
			</div>

			<button type="submit" class="btn">Register</button>

			<div class="links">
				Already have an account? <a href="../Login/login.html">Login</a>
			</div>
		</form>
	</div>

	<script src="../Register/JS/register.js"></script>
</body>
</html>
