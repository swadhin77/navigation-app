<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <link rel="stylesheet" href="../Forgot_Password/forgotpassword.css">
</head>
<body>
  <div class="overlay"></div>

  <div class="forgot-container">
    <!-- Logo -->
    <img src="../images/logoimg.jpg" alt="Map Icon" class="logo">

    <!-- Title & Slogan -->
    <h1 class="title">Forgot Password</h1>
    <p class="subtitle">Every safe trip starts with a secure login.</p>

    <!-- Form -->
    <form id="forgotForm">
      <input type="number" id="phoneno" name="phoneno" 
             placeholder="Enter your Mobile No" 
             pattern="[0-9]{10}" title="Enter 10 digit mobile number" required>

      <input type="password" id="new_password" name="new_password" 
             placeholder="Enter New Password" minlength="6" required>

      <input type="password" id="confirm_password" name="confirm_password" 
             placeholder="Confirm New Password" minlength="6" required>

      <p id="error-msg" class="error"></p>
      <input type="submit" value="Change Password">
    </form>

    <!-- Back to Login -->
    <div class="links">
      <a href="../Login/login.html">Back to Login</a>
    </div>
  </div>

  <script src="../Forgot_Password/forgotpassword.js"></script>
</body>
</html>
